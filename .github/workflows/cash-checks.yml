name: Cash management checks
on:
  push:
    paths:
      - 'cash/**'
      - 'printer-connector/**'
      - 'db/cash_drawer_foundation.sql'
      - 'server.js'
      - 'package.json'
      - '.github/workflows/cash-checks.yml'
  pull_request:
    paths:
      - 'cash/**'
      - 'printer-connector/**'
      - 'db/cash_drawer_foundation.sql'
      - 'server.js'
      - 'package.json'
      - '.github/workflows/cash-checks.yml'
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run test:cash
      - run: python -m unittest discover -s printer-connector -p 'test_*.py'
      - run: node --check server.js
